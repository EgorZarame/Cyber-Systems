server:
  port: 8082

spring:
  application:
    name: data-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cybersystems}
    username: ${DB_USER:cybersystems}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# общий секрет между нашими сервисами; если пустой, проверка выключена (удобно локально)
internal:
  token: ${INTERNAL_TOKEN:}
