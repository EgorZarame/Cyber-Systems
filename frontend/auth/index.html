<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиберСистемс - Вход</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-box {
            width: 380px;
            padding: 30px;
            background: rgba(21, 21, 48, 0.9);
            border: 2px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.15);
        }

        .auth-title {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            text-align: center;
            margin-bottom: 20px;
        }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }

        .tab {
            flex: 1;
            padding: 8px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #00ff88;
            font-family: inherit;
            cursor: pointer;
        }

        .tab.active, .tab:hover { background: #00ff88; color: #0a0a1a; }

        label { display: block; margin-bottom: 14px; font-size: 14px; }

        input {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            background: #0a0a1a;
            color: #ffffff;
            border: 1px solid rgba(0, 255, 136, 0.4);
            font-family: inherit;
            font-size: 15px;
        }

        input:focus { outline: none; border-color: #00ff88; box-shadow: 0 0 8px #00ff88; }

        .submit {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            background: #00ff88;
            color: #0a0a1a;
            border: none;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit:disabled { opacity: 0.5; cursor: wait; }

        .error { min-height: 20px; margin-top: 12px; color: #ff4d6d; font-size: 14px; }
    </style>
</head>
<body>
    <div class="auth-box">
        <div class="auth-title">КиберСистемс</div>

        <div class="tabs">
            <button class="tab active" id="tabLogin" type="button">Вход</button>
            <button class="tab" id="tabRegister" type="button">Регистрация</button>
        </div>

        <form id="authForm">
            <label>Логин
                <input id="login" type="text" autocomplete="username" minlength="3" maxlength="50" required>
            </label>
            <label>Пароль
                <input id="password" type="password" autocomplete="current-password" minlength="6" maxlength="72" required>
            </label>
            <button class="submit" id="submit" type="submit">Войти</button>
            <div class="error" id="error"></div>
        </form>
    </div>

    <script src="../api.js"></script>
    <script src="auth.js"></script>
</body>
</html>
